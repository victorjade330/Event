<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BLOK Capital — Member Card Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#1a6fff;
  --blue2:#3b9bff;
  --ink:#0a1628;
  --border:#d5e4f7;
  --pale:#eef4ff;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Syne',sans-serif;
  background:#f2f6fc;
  color:var(--ink);
  padding:40px 20px;
}

.app{
  max-width:900px;
  margin:auto;
}

h1{
  font-size:42px;
  margin-bottom:10px;
}

.panel{
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px;
  margin-top:20px;
}

label{
  display:block;
  margin-bottom:8px;
  font-size:12px;
  font-weight:700;
}

input, select{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--pale);
  font-family:'Syne',sans-serif;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

@media(max-width:700px){
  .row{
    grid-template-columns:1fr;
  }
}

button{
  margin-top:20px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;
  border:none;
  padding:14px 22px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

canvas{
  width:100%;
  border-radius:20px;
  margin-top:30px;
  border:1px solid var(--border);
}

.small{
  margin-top:10px;
  color:#64748b;
  font-size:13px;
}
</style>
</head>
<body>

<div class="app">

  <h1>BLOK Capital Member Card</h1>
  <p>Create your community member card instantly.</p>

  <div class="panel">

    <div class="row">
      <div>
        <label>X Handle</label>
        <input id="handle" placeholder="yourhandle" />
      </div>

      <div>
        <label>Display Name</label>
        <input id="displayName" placeholder="John Blok" />
      </div>
    </div>

    <div class="row" style="margin-top:16px;">
      <div>
        <label>Rank</label>
        <select id="rank">
          <option value="Holder">Holder</option>
          <option value="Builder">Builder</option>
          <option value="Alpha">Alpha</option>
          <option value="OG">OG</option>
          <option value="Whale">Whale</option>
        </select>
      </div>

      <div>
        <label>Profile Photo</label>
        <input type="file" id="photo" accept="image/*" />
      </div>
    </div>

    <button id="generateBtn">Generate Card</button>

  

  </div>

  <canvas id="card" width="1200" height="675"></canvas>

</div>

<script>

const canvas = document.getElementById('card');
const ctx = canvas.getContext('2d');

let uploadedImage = null;

document.getElementById('photo').addEventListener('change', (e) => {
  const file = e.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(event) {
    const img = new Image();

    img.onload = () => {
      uploadedImage = img;
    };

    img.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

document.getElementById('generateBtn').addEventListener('click', async () => {

  await document.fonts.ready;

  const handle = document.getElementById('handle').value.trim().replace('@','');
  const displayName = document.getElementById('displayName').value.trim() || handle;
  const rank = document.getElementById('rank').value;

  drawCard(displayName, handle, rank);
});

function drawCard(name, handle, rank){

  ctx.clearRect(0,0,1200,675);

  const bg = ctx.createLinearGradient(0,0,1200,675);
  bg.addColorStop(0,'#0d4fd4');
  bg.addColorStop(1,'#3b9bff');

  ctx.fillStyle = bg;
  ctx.fillRect(0,0,1200,675);

  ctx.fillStyle = 'rgba(255,255,255,0.08)';

  for(let i=0;i<60;i++){
    ctx.beginPath();
    ctx.arc(
      Math.random()*1200,
      Math.random()*675,
      Math.random()*4,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  ctx.fillStyle = '#fff';
  ctx.font = '800 52px Syne';
  ctx.fillText('BLOK Capital', 60, 90);

  ctx.font = '700 22px Syne';
  ctx.fillText('BLOCKCHAIN ASSET MANAGEMENT', 60, 130);

  ctx.beginPath();
  ctx.arc(160,330,95,0,Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  if(uploadedImage){

    ctx.save();

    ctx.beginPath();
    ctx.arc(160,330,88,0,Math.PI*2);
    ctx.clip();

    ctx.drawImage(uploadedImage, 72, 242, 176, 176);

    ctx.restore();

  } else {

    ctx.fillStyle = '#1a6fff';
    ctx.font = '800 70px Syne';
    ctx.textAlign = 'center';
    ctx.fillText(name.charAt(0).toUpperCase(),160,355);
    ctx.textAlign = 'left';
  }

  ctx.fillStyle = '#fff';

  ctx.font = '800 64px Syne';
  ctx.fillText(name, 300, 290);

  ctx.font = '600 28px DM Mono';
  ctx.fillText('@' + handle, 300, 335);

  ctx.font = '700 24px Syne';
  ctx.fillText('Rank: ' + rank, 300, 390);

  ctx.font = '600 18px Syne';
  ctx.fillText('Verified Community Member', 300, 440);

  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(0,620,1200,55);

  ctx.fillStyle = '#fff';
  ctx.font = '600 18px Syne';
  ctx.fillText('blokcapital.io', 50, 655);
}

drawCard('Member','yourhandle','Holder');

</script>

</body>
</html>
